<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>손글씨 숫자 인식기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; color: #e94560; }
    p.subtitle { color: #aaa; margin-bottom: 30px; font-size: 0.95rem; }
    #status { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }

    .main-layout {
      display: flex; gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .canvas-section { display: flex; flex-direction: column; align-items: center; }
    .canvas-wrapper {
      background: #16213e;
      border: 3px solid #e94560;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    #drawCanvas {
      display: block; background: #fff;
      cursor: crosshair; border-radius: 6px; touch-action: none;
    }
    .btn-group { display: flex; gap: 12px; }
    button {
      padding: 12px 28px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #recognizeBtn { background: #e94560; color: white; }
    #recognizeBtn:hover:not(:disabled) { background: #c83050; }
    #clearBtn { background: #0f3460; color: white; border: 2px solid #e94560; }
    #clearBtn:hover:not(:disabled) { background: #1a4a80; }

    .result-section { min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
    .result-number-box {
      background: #16213e; border-radius: 12px;
      padding: 24px; text-align: center; border: 1px solid #0f3460;
    }
    .result-number { font-size: 6rem; font-weight: bold; color: #e94560; line-height: 1; }
    .result-label { color: #aaa; font-size: 0.9rem; margin-top: 8px; }
    .prob-box {
      background: #16213e; border-radius: 12px;
      padding: 20px 24px; border: 1px solid #0f3460;
    }
    .prob-title { color: #888; font-size: 0.8rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .prob-row { display: flex; align-items: center; margin: 6px 0; font-size: 0.85rem; }
    .prob-label { width: 18px; color: #ccc; font-weight: bold; }
    .prob-bar-wrap { flex: 1; background: #0f3460; border-radius: 4px; height: 14px; margin: 0 10px; overflow: hidden; }
    .prob-bar { height: 100%; background: #e94560; border-radius: 4px; transition: width 0.4s ease; width: 0%; }
    .prob-value { width: 38px; text-align: right; color: #aaa; }
  </style>
</head>
<body>
  <h1>✍️ 손글씨 숫자 인식기</h1>
  <p class="subtitle">캔버스에 숫자(0~9)를 그리고 [인식하기] 버튼을 눌러보세요!</p>
  <div id="status">모델 로딩 중... 잠시만 기다려 주세요</div>

  <div class="main-layout">
    <div class="canvas-section">
      <div class="canvas-wrapper">
        <canvas id="drawCanvas" width="280" height="280"></canvas>
      </div>
      <div class="btn-group">
        <button id="recognizeBtn" disabled>🔍 인식하기</button>
        <button id="clearBtn">🗑️ 지우기</button>
      </div>
    </div>

    <div class="result-section">
      <div class="result-number-box">
        <div class="result-number" id="resultNum">?</div>
        <div class="result-label" id="resultConf">숫자를 그린 후 인식하기를 눌러주세요</div>
      </div>
      <div class="prob-box">
        <div class="prob-title">각 숫자별 확률</div>
        <div id="probBars"></div>
      </div>
    </div>
  </div>

  <script>
    // ── 확률 막대 생성 ──
    const probBarsEl = document.getElementById('probBars');
    for (let i = 0; i <= 9; i++) {
      probBarsEl.innerHTML += `
        <div class="prob-row">
          <span class="prob-label">${i}</span>
          <div class="prob-bar-wrap"><div class="prob-bar" id="bar${i}"></div></div>
          <span class="prob-value" id="pct${i}">0%</span>
        </div>`;
    }

    // ── 캔버스 설정 ──
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false, lastX = 0, lastY = 0;

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 24;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 280, 280);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }
    canvas.addEventListener('mousedown', e => { drawing = true; ({x: lastX, y: lastY} = getPos(e)); });
    canvas.addEventListener('mousemove', e => {
      if (!drawing) return;
      const {x, y} = getPos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      lastX = x; lastY = y;
    });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mouseleave', () => drawing = false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; ({x: lastX, y: lastY} = getPos(e)); }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!drawing) return;
      const {x, y} = getPos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      lastX = x; lastY = y;
    }, {passive: false});
    canvas.addEventListener('touchend', () => drawing = false);

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, 280, 280);
      document.getElementById('resultNum').textContent = '?';
      document.getElementById('resultConf').textContent = '숫자를 그린 후 인식하기를 눌러주세요';
      for (let i = 0; i <= 9; i++) {
        document.getElementById(`bar${i}`).style.width = '0%';
        document.getElementById(`pct${i}`).textContent = '0%';
      }
    });

    // ── MLP 추론 ──
    let weights = null;

    function relu(arr) { return arr.map(v => v > 0 ? v : 0); }

    function matmulAdd(x, W, b) {
      // x: [n], W: [n][m], b: [m] → [m]
      const m = W[0].length;
      const out = new Float32Array(m);
      for (let j = 0; j < m; j++) {
        let s = b[j];
        for (let i = 0; i < x.length; i++) s += x[i] * W[i][j];
        out[j] = s;
      }
      return out;
    }

    function softmax(arr) {
      const max = Math.max(...arr);
      const exp = arr.map(v => Math.exp(v - max));
      const sum = exp.reduce((a, b) => a + b, 0);
      return exp.map(v => v / sum);
    }

    function mlpPredict(pixelArr) {
      // 정규화
      const n = pixelArr.length;
      let x = new Float32Array(n);
      for (let i = 0; i < n; i++) x[i] = (pixelArr[i] - weights.mean[i]) / weights.scale[i];

      // 히든 레이어 (ReLU)
      for (let l = 0; l < weights.coefs.length - 1; l++) {
        x = relu(matmulAdd(x, weights.coefs[l], weights.intercepts[l]));
      }
      // 출력 레이어
      const last = weights.coefs.length - 1;
      x = matmulAdd(x, weights.coefs[last], weights.intercepts[last]);
      return softmax(Array.from(x));
    }

    // ── 이미지 전처리 ──
    function gaussianBlur3x3(pixels, w, h) {
      const k = [1,2,1, 2,4,2, 1,2,1];
      const out = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sum = 0, wsum = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const ny = y + ky, nx = x + kx;
              if (ny >= 0 && ny < h && nx >= 0 && nx < w) {
                const ki = k[(ky+1)*3 + (kx+1)];
                sum += pixels[ny*w + nx] * ki;
                wsum += ki;
              }
            }
          }
          out[y*w + x] = sum / wsum;
        }
      }
      return out;
    }

    function preprocessCanvas() {
      const W = 280, H = 280;
      const imgData = ctx.getImageData(0, 0, W, H).data;

      // 흑백 반전 (흰 배경 → 0, 검은 획 → 255)
      const gray = new Float32Array(W * H);
      for (let i = 0; i < W * H; i++) gray[i] = 255 - imgData[i * 4];

      // 경계 탐색
      let top = H, bottom = -1, left = W, right = -1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (gray[y*W + x] > 20) {
          if (y < top) top = y; if (y > bottom) bottom = y;
          if (x < left) left = x; if (x > right) right = x;
        }
      }
      if (bottom < 0) return null;

      const cH = bottom - top + 1, cW = right - left + 1;

      // 종횡비 유지 리사이즈 (최소 3px)
      const scale = 20 / Math.max(cH, cW);
      const nH = Math.max(3, Math.floor(cH * scale));
      const nW = Math.max(3, Math.floor(cW * scale));

      // 오프스크린 캔버스로 리사이즈
      const tmp = document.createElement('canvas');
      tmp.width = cW; tmp.height = cH;
      const tctx = tmp.getContext('2d');
      const cropImg = tctx.createImageData(cW, cH);
      for (let y = 0; y < cH; y++) for (let x = 0; x < cW; x++) {
        const v = gray[(top+y)*W + (left+x)];
        const idx = (y*cW + x) * 4;
        cropImg.data[idx] = cropImg.data[idx+1] = cropImg.data[idx+2] = v;
        cropImg.data[idx+3] = 255;
      }
      tctx.putImageData(cropImg, 0, 0);

      const res = document.createElement('canvas');
      res.width = nW; res.height = nH;
      res.getContext('2d').drawImage(tmp, 0, 0, nW, nH);

      // 20x20 박스 중앙 배치 → 28x28 (4,4)
      const img28 = document.createElement('canvas');
      img28.width = 28; img28.height = 28;
      const ictx = img28.getContext('2d');
      ictx.fillStyle = 'black';
      ictx.fillRect(0, 0, 28, 28);
      ictx.drawImage(res, 4 + Math.floor((20-nW)/2), 4 + Math.floor((20-nH)/2));

      const pxData = ictx.getImageData(0, 0, 28, 28).data;
      let px = new Float32Array(784);
      for (let i = 0; i < 784; i++) px[i] = pxData[i*4];

      // 무게중심 이동
      let sx = 0, sy = 0, total = 0;
      for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
        const v = px[y*28 + x];
        sx += v*x; sy += v*y; total += v;
      }
      if (total === 0) return null;
      const shiftX = Math.round(14 - sx/total);
      const shiftY = Math.round(14 - sy/total);

      const shifted = new Float32Array(784);
      for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
        const ny = y - shiftY, nx = x - shiftX;
        if (ny >= 0 && ny < 28 && nx >= 0 && nx < 28) shifted[y*28+x] = px[ny*28+nx];
      }

      // 가우시안 블러
      return gaussianBlur3x3(shifted, 28, 28);
    }

    // ── 인식하기 ──
    document.getElementById('recognizeBtn').addEventListener('click', () => {
      const pixels = preprocessCanvas();
      if (!pixels) {
        document.getElementById('resultConf').textContent = '숫자를 먼저 그려주세요!';
        return;
      }

      const proba = mlpPredict(pixels);
      const pred = proba.indexOf(Math.max(...proba));
      const conf = (proba[pred] * 100).toFixed(1);

      document.getElementById('resultNum').textContent = pred;
      document.getElementById('resultConf').textContent = `신뢰도: ${conf}%`;

      for (let i = 0; i <= 9; i++) {
        const p = (proba[i] * 100).toFixed(1);
        document.getElementById(`bar${i}`).style.width = p + '%';
        document.getElementById(`pct${i}`).textContent = p + '%';
      }
    });

    // ── 모델 로드 ──
    fetch('model_weights.json')
      .then(r => r.json())
      .then(data => {
        weights = data;
        document.getElementById('status').textContent = '✅ 모델 로드 완료! 숫자를 그려보세요.';
        document.getElementById('recognizeBtn').disabled = false;
      })
      .catch(() => {
        document.getElementById('status').textContent = '❌ 모델 로드 실패. 페이지를 새로고침해주세요.';
      });
  </script>
</body>
</html>
